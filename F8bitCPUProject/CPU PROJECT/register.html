<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Project - Login</title>
    <link rel="stylesheet" href="registerStyles.css">
</head>
<body>
    <main>

        

        <div id="bgimg">
            <img src="sideimg.jpg" alt="computer girl">
        </div>
        <div id="loginbox">
            <h1>Register</h1>
            <form action="#">

                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your username" 
                    minlength="3" 
                    maxlength="16" 
                    required
                >

                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" 
                    required
                >

                <div id="showpass-row">
                    <input type="checkbox" id="showPass">
                    <label for="showPass" id="showpass-label">Show Password</label>
                </div>



                <input type="submit" value="Register" id="loginBtn">

                <a href="login.html" id="registerBtn"><- Login</a>

            </form>
        </div>

    </main>

    <script>
        document.getElementById("showPass").addEventListener("change", function(){
            let passInput = document.getElementById("password");
            passInput.type = this.checked ? "text" : "password";
        });
    </script>
</body>
</html>
