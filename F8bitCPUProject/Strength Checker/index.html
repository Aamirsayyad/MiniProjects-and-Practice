<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker
    </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Check Your Password Strength</h1>
    </header>
    <main>
        <div id="ip-container">
            <input id="pass-input" name="passip"  maxlength="32" placeholder="Enter Your Password Here!" type="text">
            <span id="length">0</span>
            <button id="showpass"></button>
        </div>
        <div id="suggestions">
            <ul id="checklist">
                <li id="min-char" class="li"><span class="tick">✓</span> Minimum 8 characters</li>
                <li id="upper" class="li"><span class="tick">✓</span> Contains an Uppercase character</li>
                <li id="lower" class="li"><span class="tick">✓</span> Contains a Lowercase character</li>
                <li id="num" class="li"><span class="tick">✓</span> Contains a Number</li>
                <li id="special" class="li"><span class="tick">✓</span> Contains a Special character</li>
            </ul>
        </div>
        <div id="result-container">
            <h1>Result - <span id="strength">Weak</span></h1>
            <h2>Score : <span id="score">0</span>/10</h2>
        </div>
    </main>
    <footer>
        Footer
    </footer>


    <script src="script.js">
    </script>
</body>
</html>
