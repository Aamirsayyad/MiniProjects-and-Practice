<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>TIC TAC TOE</h1>
    </header>
    <div id="user-score-display-container" class="score-insides">
        Your Score
    </div>
    <div id="computer-score-display-container" class="score-insides">
        Computer's Score
    </div>
    <main>
        <div id="score-display">

            <div id="turn-display-container" class="">
                YOUR TURN
            </div>

        </div>
        <div id="board">
            <div class="cells val-X"></div>
            <div class="cells val-O"></div>
            <div class="cells"></div>
            <div class="cells"></div>
            <div class="cells"></div>
            <div class="cells val-O"></div>
            <div class="cells"></div>
            <div class="cells"></div>
            <div class="cells"></div>
        </div>
        <div id="description">
            AI IS THINKING
        </div>
        <button id="reset-btn">Reset Board</button>
    </main>
</body>

</html>
