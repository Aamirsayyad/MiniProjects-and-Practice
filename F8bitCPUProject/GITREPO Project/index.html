<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luci Terminal</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div id="terminal-container">
        <div id="terminal-menu-bar">
            <p id="terminal-name">Luci Terminal</p>
            <p id="minimize">_</p>
            <p id="maximize"> </p>
            <p id="close"></p>
        </div>
        <div id="terminal-body">
            <div id="previous-lines">
                
            </div>
            <span>> </span><input id="current-line">
        </div>
        
    </div>
    <div id="open-terminal-button" class="hide">
            <h1>Open Terminal</h1>
    </div>



    <script src="script.js"></script>
</body>

</html>
