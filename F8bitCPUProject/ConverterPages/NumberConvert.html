<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        
        <h1 id="title">Number System Converter</h1>
        <div id="inputContainer">
            <div class="input">
                <select id="inputBase">
                    <option>Binary</option>
                    <option>Decimal</option>
                    <option>HexaDecimal</option>
                    <option>Octal</option>
                </select>
                <input type="text" value="0" id="inputBaseValue">
            </div>
            <h2>To</h2>
            <div class="input">
                <select id="OutputBase">
                    <option>Binary</option>
                    <option>Decimal</option>
                    <option>HexaDecimal</option>
                    <option>Octal</option>
                </select>
                <input type="text" readonly value="0" id="OutputBaseValue">
            </div>
        </div>
        <input type="submit" value="Convert" onclick="Convert()">
    </main>
    <script src="script.js">
    </script>
</body>
</html>
