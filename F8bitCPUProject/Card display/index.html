<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="styles.css" rel="stylesheet">
</head>
<body>

        <div id="slides">
            <img id="img1" class="slide" src="images/Image-1.webp" alt="Graphics Card">

        <div id="buttons">

    </div>




    <script src="logic.js"></script>
