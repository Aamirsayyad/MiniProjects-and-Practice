<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <img id="sun" src="Images/Sun.png">
        <img class="planet" id="mercury" src="Images/mercury.png">
        <img class="planet" id="venus" src="Images/venus.png">
        <img class="planet" id="earth" src="Images/earth.webp">
        <img class="planet" id="mars" src="Images/mars.png">
        <img class="planet" id="jupiter" src="Images/jupiter.webp">
        <img class="planet" id="saturn" src="Images/saturn.webp">
        <img class="planet" id="uranus" src="Images/uranus.png">
        <img class="planet" id="neptune" src="Images/neptune.png">
    </div>
    <div id="menu">
        <h1>Solar System</h1>
        <label for="scale">Scale</label><br>
        <input type="range" name="scale" min="0" max="100" id="scale-slider">
        <br>
        <p id="valueforscale"></p>
        <label for="speed">Simulation Speed</label><br>
        <input type="range" name="speed" min="0" max="100" id="speed-slider">

    </div>

    <script src="logic.js"></script>
</body>
</html>
